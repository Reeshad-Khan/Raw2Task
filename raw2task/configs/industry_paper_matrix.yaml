  # Cross-dataset training with the same co-design machinery.
  - name: cityscapes_codesign_liteseg
    overrides:
      data:
        name: cityscapes_jsonl
        root: data_external/worldfactor
        train_split_file: splits/cityscapes/train.jsonl
        val_split_file: splits/cityscapes/val.jsonl
        label_encoding: cityscapes_labelIds
        img_size: [256, 512]
        batch_size: 8

  - name: cityscapes_rgb_liteseg
    overrides:
      data:
        name: cityscapes_jsonl
        root: data_external/worldfactor
        train_split_file: splits/cityscapes/train.jsonl
        val_split_file: splits/cityscapes/val.jsonl
        label_encoding: cityscapes_labelIds
        img_size: [256, 512]
        batch_size: 8
      pipeline:
        input: rgb
      train:
        sensor_lr_mult: 0.0

  - name: acdc_codesign_liteseg
    overrides:
      data:
        name: acdc_jsonl
        root: data_external/worldfactor
        train_split_file: splits/acdc/train.jsonl
        val_split_file: splits/acdc/val.jsonl
        label_encoding: labelTrainIds
        img_size: [256, 512]
        batch_size: 8

  - name: acdc_rgb_liteseg
    overrides:
      data:
        name: acdc_jsonl
        root: data_external/worldfactor
        train_split_file: splits/acdc/train.jsonl
        val_split_file: splits/acdc/val.jsonl
