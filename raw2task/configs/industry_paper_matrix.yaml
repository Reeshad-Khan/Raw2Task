        tta_scales: [0.75, 1.0, 1.25]
        tta_flip: true

  - name: kitti360_fixed_camera_segformer_b0_pretrained_softreadout_distill
    overrides:
      data:
        img_size: [384, 1280]
        batch_size: 2
      pipeline:
        input: sensor
      sensor:
        raw_output: soft_rgb
        demosaic_kernel_size: 5
        exposure_init: -1.38629436
        learn_cfa: false
        learn_exposure: false
        learn_noise: false
        learn_bit_depth: false
      lens:
        learn_optics: false
      model:
        name: segformer_b0
        pretrained: true
        hf_model_id: nvidia/segformer-b0-finetuned-cityscapes-1024-1024
      train:
        epochs: 120
        lr: 0.0002
        sensor_lr_mult: 0.0
        accum_steps: 2
        ema: true
        ema_decay: 0.999
