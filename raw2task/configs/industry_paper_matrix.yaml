        tta_flip: true

  - name: kitti360_rgb_segformer_b0_pretrained_highres_distill
    overrides:
      data:
        img_size: [384, 1280]
        batch_size: 2
      pipeline:
        input: rgb
      model:
        name: segformer_b0
        pretrained: true
        hf_model_id: nvidia/segformer-b0-finetuned-cityscapes-1024-1024
      train:
        epochs: 120
