name: kitti360_review_base
seed: 0
task: seg

data:
  name: kitti360_seg
  root_seg: /home/re141872/Research/data/kitti360
  img_size: [192, 640]
  photometric_jitter: 0.15
  camera: image_00
  label_encoding: original_id
  batch_size: 8
  num_workers: 4
  train_stride: 1
  val_stride: 1
  # Rare/thin classes are badly underrepresented at 192x640. Oversampling
  # frames containing them improves recall without changing the validation set.
  rare_class_ids: [5, 6, 7, 11, 12, 14, 15, 16, 17, 18]
  rare_oversample_factor: 3.0

pipeline:
  # sensor = processed RGB used as a proxy scene signal, then simulated optics/CFA/noise/quantization.
  # rgb = fair RGB baseline on the exact same split/metric.
  input: sensor

model:
  name: liteseg
  width: 48
  num_classes: 19
  ignore_index: 255
  pretrained_backbone: false

sensor:
  cfa_init: bayer_rggb
  # CoDesignSensor parameterizes gain as 0.25 + 3.75 * sigmoid(raw).
  # -1.38629436 initializes the physical gain at 1.0 instead of saturating
  # the input near 2.125x exposure.
  exposure_init: -1.38629436
  learn_cfa: true
  learn_exposure: true
  sensor_pitch: 1.6e-6
  bit_depth: 8
  read_noise_std: 0.003
  shot_noise_scale: 0.02
  learn_noise: true
  learn_bit_depth: true
  min_read_noise_std: 0.00001
  max_read_noise_std: 0.05
  min_shot_noise_scale: 0.00001
  max_shot_noise_scale: 0.12
  min_bit_depth: 4
  max_bit_depth: 12
  regularization:
    cfa_collapse: 0.05
    exposure_prior: 0.10
    read_noise_prior: 0.05
    shot_noise_prior: 0.05
    bit_depth_prior: 0.02

lens:
  # Main co-design path: bounded trainable field PSF, exported as a fixed
  # camera design after training. Set mode: geolens and path for fixed-lens
  # rendering ablations.
  mode: trainable_psf
  path: ""
  learn_optics: true
  spp: 1
  render_scale: 1.0
  no_grad: false
  use_amp: true
  normalize_output: true
  target_mean: 0.5
  trainable_psf:
    num_zones: 5
    kernel_size: 15
    base_sigma_px: 1.05
    min_sigma_px: 0.35
    max_sigma_px: 3.75
    max_shift_px: 1.25
    field_sigma: 0.65
    init_field_aberration: true
    regularization:
      psf_second_moment: 1.0
      field_smoothness: 0.25
      chromatic_smoothness: 0.10
      coma_shift: 0.25
      kernel_tv: 0.02

train:
  epochs: 80
  depth: 10.0
  lr: 0.002
  weight_decay: 0.0001
  sensor_lr_mult: 0.5
  ckpt_dir: ./runs/kitti360_review_base
  log_interval: 20
  resume: false
  keep_last_n: 2
  amp: true
  accum_steps: 1
  channels_last: false
  torch_compile: false
  lr_plateau_patience: 3
  lr_reduce_factor: 0.4
  lr_plateau_cooldown: 0
  min_lr: 0.000003
  checkpoint_average_k: 3
  checkpoint_average_source: best
  checkpoint_average_use_ema: true
  ce_weight: 0.6
  overlap_weight: 0.4
  overlap_loss: lovasz
  use_lovasz: true
  ohem_pct: 0.25
  smooth_lambda: 0.05
  smooth_sigma_rgb: 0.10
  distill_weight: 0.0
  distill_temperature: 2.0
  distill_confidence_threshold: 0.55
  task_feedback_weight: 0.15
  task_feedback_entropy_weight: 0.60
  task_feedback_error_weight: 1.00
  task_feedback_boundary_weight: 1.25
  task_feedback_rare_weight: 1.50
  task_feedback_detach: true
  task_feedback_controller: true
  task_feedback_controller_ema: 0.70
  task_feedback_iou_gamma: 1.50
  task_feedback_min_pressure: 0.75
  task_feedback_max_pressure: 2.50
  task_feedback_min_support: 1000
  sensor_reg_weight: 0.001
  export_design_every: 1
  grad_clip_norm: 1.0
  early_stop_patience: 12
  early_stop_min_delta: 0.0005

loss:
  class_weight_batches: 500
  class_weight_min: 0.05
  class_weight_max: 25.0
  rare_class_boost:
    5: 1.5    # pole
    6: 3.0    # traffic light
    7: 2.0    # traffic sign
    11: 2.0   # person
    12: 2.5   # rider
    14: 1.8   # truck
    15: 2.0   # bus
    16: 3.0   # train
    17: 3.0   # motorcycle
    18: 3.0   # bicycle

debug:
  bypass_optics: false
  bypass_cfa: false
  bypass_noise: false
  dump_stats: false

eval:
  viz_every: 200
  train_viz_steps: [1]
  include_stages_in_viz: true
  use_crf: false


distillation:
  enabled: false
  teacher_model:
    name: segformer_b1
    pretrained: true
    hf_model_id: nvidia/segformer-b1-finetuned-cityscapes-1024-1024
