name: kitti360_unified_rgb_fast
seed: 0
device: cuda

pipeline:
  input: rgb

data_2d:
  root_seg: /home/rk010/Desktop/Research/NurIPS/KITTI-360
  img_size: [256, 768]
  camera: image_00
  label_encoding: original_id
  batch_size: 4
  photometric_jitter: 0.15
  train_stride: 2
  val_stride: 4
  max_train_samples: 12000
  max_val_samples: 2000

data_voxel:
  root: data_external/kitti360_occupancy
  train_manifest: data_external/kitti360_occupancy/manifests/train.jsonl
  val_manifest: data_external/kitti360_occupancy/manifests/val.jsonl
  image_size: [192, 640]
  grid_shape: [16, 64, 128]
  num_cameras: 1
  batch_size: 1
  require_calibration: true
  require_camera_mask: true
  max_train_samples: 400
  max_val_samples: 100

model:
  width: 64
  num_classes: 19
  num_2d_classes: 19
  num_3d_classes: 19
  ignore_index: 255

sensor:
  raw_output: rgb

lens:
  mode: identity
  path: ""
  learn_optics: false

train:
  epochs: 8
  steps_per_epoch: 500
  num_workers: 4
  lr: 0.0002
  weight_decay: 0.0001
  sensor_lr_mult: 0.0
  sensor_reg_weight: 0.0
  lambda_2d: 1.0
  lambda_3d: 1.0
  lambda_occupancy: 0.25
  ckpt_dir: ./runs/unified_multitask/kitti360_unified_rgb_fast
  log_interval: 25
  amp: true
  grad_clip_norm: 1.0
  viz_interval: 1
  viz_items: 3
  export_design_every: 1
