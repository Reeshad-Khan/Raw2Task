base_config: deeplens/projects/raw2task/configs/kitti360_review_base.yaml
out_root: ./runs/accuracy_recovery_fast
seeds: [0]

# Fast but serious accuracy-recovery matrix.
# Purpose: test whether co-design can approach strong contemporary RGB references
# before committing full-run compute. These are not the embedded headline rows.
experiments:
  - name: acc_rgb_segformer_b0_highres_fast
    overrides:
      data: &acc_data_b0
        img_size: [320, 1024]
        batch_size: 2
        max_train_samples: 16000
        max_val_samples: 3000
        train_stride: 1
        val_stride: 2
        rare_oversample_factor: 3.0
        photometric_jitter: 0.12
      pipeline:
        input: rgb
      model: &segformer_b0
        name: segformer_b0
        pretrained: true
        hf_model_id: nvidia/segformer-b0-finetuned-cityscapes-1024-1024
      train: &acc_train_b0
        epochs: 32
        lr: 0.00016
        sensor_lr_mult: 0.0
        accum_steps: 3
        ema: true
        ema_decay: 0.999
        checkpoint_average_k: 3
        log_interval: 40
        early_stop_patience: 8
        early_stop_min_delta: 0.0007
        ce_weight: 0.65
        overlap_weight: 0.35
        smooth_lambda: 0.02
        sensor_trust_region: &sensor_trust_region
          enabled: true
          counterfactual_interval: 25
          harm_tolerance: 0.003
          improve_tolerance: 0.001
          shrink_factor: 0.5
          expand_factor: 1.06
          min_lr_mult: 0.05
          max_lr_mult: 1.0
          good_patience: 3
          revert_on_harm: false
      eval: &acc_eval
        viz_every: 100
        tta: false
        tta_scales: [1.0]
        tta_flip: false

  - name: acc_fixed_camera_segformer_b0_highres_fast
    overrides:
      data: *acc_data_b0
      pipeline:
        input: sensor
      sensor: &soft_rgb_fixed
        raw_output: soft_rgb
        demosaic_kernel_size: 5
        exposure_init: -1.38629436
        learn_cfa: false
        learn_exposure: false
        learn_noise: false
        learn_bit_depth: false
      lens:
        learn_optics: false
        trainable_psf:
          base_sigma_px: 0.55
          min_sigma_px: 0.20
          max_sigma_px: 1.75
          max_shift_px: 0.50
      model: *segformer_b0
      train:
        <<: *acc_train_b0
        sensor_lr_mult: 0.0
      eval: *acc_eval

  - name: acc_codesign_segformer_b0_highres_warm_fast
    overrides:
      data: *acc_data_b0
      pipeline:
        input: sensor
      sensor:
        raw_output: soft_rgb
        demosaic_kernel_size: 5
        exposure_init: -1.38629436
        learn_cfa: true
        learn_exposure: true
        learn_noise: true
        learn_bit_depth: true
        regularization:
          cfa_collapse: 0.03
          exposure_prior: 0.05
          read_noise_prior: 0.03
          shot_noise_prior: 0.03
          bit_depth_prior: 0.04
      lens:
        learn_optics: true
        trainable_psf:
          num_zones: 5
          kernel_size: 13
          base_sigma_px: 0.55
          min_sigma_px: 0.20
          max_sigma_px: 1.75
          max_shift_px: 0.50
          field_sigma: 0.45
          regularization:
            psf_second_moment: 0.75
            field_smoothness: 0.35
            chromatic_smoothness: 0.20
            coma_shift: 0.35
            kernel_tv: 0.03
      model: *segformer_b0
      train:
        <<: *acc_train_b0
        sensor_lr_mult: 0.08
        sensor_reg_weight: 0.0008
        sensor_warmup_epochs: 4
        smooth_lambda: 0.04
      eval: *acc_eval

  - name: acc_rgb_segformer_b1_highres_fast
    overrides:
      data: &acc_data_b1
        img_size: [320, 1024]
        batch_size: 1
        max_train_samples: 16000
        max_val_samples: 3000
        train_stride: 1
        val_stride: 2
        rare_oversample_factor: 3.0
        photometric_jitter: 0.12
      pipeline:
        input: rgb
      model: &segformer_b1
        name: segformer_b1
        pretrained: true
        hf_model_id: nvidia/segformer-b1-finetuned-cityscapes-1024-1024
      train: &acc_train_b1
        epochs: 32
        lr: 0.00012
        sensor_lr_mult: 0.0
        accum_steps: 6
        ema: true
        ema_decay: 0.999
        checkpoint_average_k: 3
        log_interval: 40
        early_stop_patience: 8
        early_stop_min_delta: 0.0007
        ce_weight: 0.65
        overlap_weight: 0.35
        smooth_lambda: 0.02
      eval: *acc_eval

  - name: acc_codesign_segformer_b1_highres_warm_fast
    overrides:
      data: *acc_data_b1
      pipeline:
        input: sensor
      sensor:
        raw_output: soft_rgb
        demosaic_kernel_size: 5
        exposure_init: -1.38629436
        learn_cfa: true
        learn_exposure: true
        learn_noise: true
        learn_bit_depth: true
        regularization:
          cfa_collapse: 0.03
          exposure_prior: 0.05
          read_noise_prior: 0.03
          shot_noise_prior: 0.03
          bit_depth_prior: 0.04
      lens:
        learn_optics: true
        trainable_psf:
          num_zones: 5
          kernel_size: 13
          base_sigma_px: 0.55
          min_sigma_px: 0.20
          max_sigma_px: 1.75
          max_shift_px: 0.50
          field_sigma: 0.45
          regularization:
            psf_second_moment: 0.75
            field_smoothness: 0.35
            chromatic_smoothness: 0.20
            coma_shift: 0.35
            kernel_tv: 0.03
      model: *segformer_b1
      train:
        <<: *acc_train_b1
        sensor_lr_mult: 0.06
        sensor_reg_weight: 0.0008
        sensor_warmup_epochs: 4
        smooth_lambda: 0.04
      eval: *acc_eval
