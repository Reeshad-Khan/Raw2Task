# Final paper experiments: task-optimal spectral CFA design for ACDC.
#
# Existing v2 results to report alongside (from ./runs/acdc_sfb4/):
#   rgb_acdc              mIoU=0.7374
#   ablate_fixed_camera   mIoU=0.6654
#   ablate_no_optics      mIoU=0.6992
#   codesign_acdc         mIoU=0.6906

base_config: raw2task/configs/acdc_sfb4_base.yaml
out_root: ./runs/acdc_sfb4_spectral
seeds: [0]

experiments:

  - name: cfa_only_acdc
    overrides:
      debug:
        bypass_optics: true
      lens:
        mode: identity
        path: ""
      sensor:
        learn_noise: false
        learn_bit_depth: false
      train:
        backbone_freeze_epochs: 0
        alternating_opt_enabled: false
        psf_proximity_weight: 0.0

  - name: cfa_tile3_acdc
    overrides:
      debug:
        bypass_optics: true
      lens:
        mode: identity
        path: ""
      sensor:
        cfa_tile_size: 3
      train:
        backbone_freeze_epochs: 0
        alternating_opt_enabled: false
        psf_proximity_weight: 0.0

  - name: cfa_tile4_acdc
    overrides:
      debug:
        bypass_optics: true
      lens:
        mode: identity
        path: ""
      sensor:
        cfa_tile_size: 4
      train:
        backbone_freeze_epochs: 0
        alternating_opt_enabled: false
        psf_proximity_weight: 0.0
