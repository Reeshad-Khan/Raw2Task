# Final paper experiments: task-optimal spectral CFA design for KITTI-360.
#
# These 3 experiments extend the v2 ablation (rgb / fixed / no_optics / codesign)
# with the novel spectral tile contribution.  All use identical training settings
# to v2 no_optics (no backbone freeze, no alternating opt, no PSF) so results
# are directly comparable.
#
# Existing v2 results to report alongside these (from ./runs/kitti360_sfb4/):
#   rgb_sfb4              mIoU=0.6396
#   ablate_fixed_camera   mIoU=0.6043 (approx, finishing)
#   ablate_no_optics      mIoU=0.6229 (approx, finishing)
#   codesign_sfb4         mIoU=0.6031 (approx, finishing)

base_config: raw2task/configs/kitti360_sfb4_base.yaml
out_root: ./runs/kitti360_sfb4_spectral
seeds: [0]

experiments:

  # tile=2 CFA+noise baseline (symlinked from v2 — no retraining needed).
  # Provides the direct tile2 reference point for the tile3/tile4 comparison.
  - name: ablate_no_optics_sfb4
    overrides:
      debug:
        bypass_optics: true
      lens:
        mode: identity
        path: ""

  # Isolates the CFA-only contribution: tile=2, fixed noise, identity PSF.
  # Expected: below no_optics (noise learning absent) but above fixed_camera.
  - name: cfa_only_sfb4
    overrides:
      debug:
        bypass_optics: true
      lens:
        mode: identity
        path: ""
      sensor:
        learn_noise: false
        learn_bit_depth: false
      train:
        backbone_freeze_epochs: 0
        alternating_opt_enabled: false
        psf_proximity_weight: 0.0

  # Novel contribution: 3×3 spectral mosaic (9 filters).
  # CFA + noise learning, no PSF.  Baseline: no_optics (tile=2 CFA+noise).
  - name: cfa_tile3_sfb4
    overrides:
      debug:
        bypass_optics: true
      lens:
        mode: identity
        path: ""
      sensor:
        cfa_tile_size: 3
      train:
        backbone_freeze_epochs: 0
        alternating_opt_enabled: false
        psf_proximity_weight: 0.0

  # Novel contribution: 4×4 spectral mosaic (16 filters).
  # Maximum spectral diversity within the RGB colour space.
  - name: cfa_tile4_sfb4
    overrides:
      debug:
        bypass_optics: true
      lens:
        mode: identity
        path: ""
      sensor:
        cfa_tile_size: 4
      train:
        backbone_freeze_epochs: 0
        alternating_opt_enabled: false
        psf_proximity_weight: 0.0
