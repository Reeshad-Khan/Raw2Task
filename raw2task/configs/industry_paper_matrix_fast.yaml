base_config: raw2task/configs/kitti360_review_base.yaml
out_root: ./runs/industry_paper_matrix_fast
seeds: [0]

# Fast evidence matrix for iteration, sanity checks, and figure generation.
# This is intentionally separate from industry_paper_matrix.yaml so short runs
# never overwrite or contaminate the final 120-epoch paper protocol.
experiments:
  - name: fast_codesign_segformer_b0_softreadout
    overrides:
      data:
        img_size: [256, 768]
        batch_size: 4
        max_train_samples: 12000
        max_val_samples: 2000
        train_stride: 2
        val_stride: 4
      pipeline:
        input: sensor
      sensor:
        raw_output: soft_rgb
        demosaic_kernel_size: 5
        exposure_init: -1.38629436
      model:
        name: segformer_b0
        pretrained: true
        hf_model_id: nvidia/segformer-b0-finetuned-cityscapes-1024-1024
      train:
        epochs: 20
        lr: 0.0002
        sensor_lr_mult: 0.15
        accum_steps: 2
        ema: true
        ema_decay: 0.999
        smooth_lambda: 0.04
        checkpoint_average_k: 2
        log_interval: 25
        early_stop_patience: 5
        early_stop_min_delta: 0.001
      eval:
        viz_every: 100
        tta: false
        tta_scales: [1.0]
        tta_flip: false

