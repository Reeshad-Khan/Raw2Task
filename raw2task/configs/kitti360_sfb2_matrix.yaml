base_config: raw2task/configs/kitti360_sfb2_base.yaml
out_root: ./runs/kitti360_sfb2
seeds: [0]    # single seed first — verify it works before committing 3 seeds

experiments:
  - name: codesign_sfb2
    overrides: {}

  - name: rgb_sfb2
    overrides:
      pipeline:
        input: rgb
      train:
        sensor_lr_mult: 0.0

  - name: ablate_fixed_camera_frontend_sfb2
    overrides:
      sensor:
        learn_cfa: false
        learn_exposure: false
        learn_noise: false
        learn_bit_depth: false
      lens:
        learn_optics: false

  - name: ablate_no_optics_sfb2
    overrides:
      debug:
        bypass_optics: true
      lens:
        mode: identity
        path: ""

  - name: ablate_fixed_optics_sfb2
    overrides:
      lens:
        learn_optics: false
