base_config: deeplens/projects/raw2task/configs/kitti360_review_base.yaml
out_root: ./runs/sensor_stress_matrix_fast
seeds:
- 0
experiments:
- name: stress_lowlight_codesign_segformer_b0
  overrides:
    data: &id001
      img_size:
      - 256
      - 768
      batch_size: 4
      max_train_samples: 12000
      max_val_samples: 2000
      train_stride: 2
      val_stride: 4
      photometric_jitter: 0.2
    pipeline: &id002
      input: sensor
    sensor:
      raw_output: rggbi
      demosaic_kernel_size: 5
      sensor_model: deeplens_nbit
      black_level: 4
      iso_base: 100
      iso: 400
      iso_scale: 1000
      exposure_init: -2.94443898
      bit_depth: 6
      read_noise_std: 2.0
      shot_noise_scale: 0.55
      min_read_noise_std: 1.0e-05
      max_read_noise_std: 8.0
      min_shot_noise_scale: 1.0e-05
      max_shot_noise_scale: 1.5
      min_bit_depth: 4
      max_bit_depth: 8
      learn_cfa: true
      learn_exposure: true
      learn_noise: true
      learn_bit_depth: true
      regularization:
        cfa_collapse: 0.02
        exposure_prior: 0.02
        read_noise_prior: 0.02
        shot_noise_prior: 0.02
        bit_depth_prior: 0.04
    model: &id003
      name: segformer_b0
      pretrained: true
      hf_model_id: nvidia/segformer-b0-finetuned-cityscapes-1024-1024
    train:
      epochs: 24
      lr: 0.0002
      sensor_lr_mult: 0.25
      sensor_reg_weight: 0.0005
      accum_steps: 2
      ema: true
      ema_decay: 0.999
      checkpoint_average_k: 2
      log_interval: 25
      early_stop_patience: 6
      early_stop_min_delta: 0.001
    eval: &id004
      viz_every: 100
      tta: false
      tta_scales:
      - 1.0
      tta_flip: false
